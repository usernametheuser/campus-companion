; Campus Companion - PlatformIO build
; Arduino IDE users can ignore this file and open firmware/CampusCompanion/CampusCompanion.ino.
;
;   pio run -e esp32s3 -t upload       flash the firmware
;   pio run -e esp32s3 -t uploadfs     flash the web app (LittleFS image of data/)
;   pio device monitor                 serial log

[platformio]
src_dir = firmware/CampusCompanion
data_dir = firmware/CampusCompanion/data
default_envs = esp32s3

[env]
; pioarduino: community PlatformIO platform that ships Arduino-ESP32 core 3.x
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
framework = arduino
board = esp32-s3-devkitc-1
board_build.filesystem = littlefs
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
lib_deps =
    ESP32Async/ESPAsyncWebServer@^3.7.0
    ESP32Async/AsyncTCP@^3.3.0
    bblanchon/ArduinoJson@^7.3.0

; ESP32-S3 with 8 MB flash, no PSRAM (N8) - the most common dev module
[env:esp32s3]
board_upload.flash_size = 8MB
board_build.partitions = default_8MB.csv

; ESP32-S3 with 16 MB flash + 8 MB octal PSRAM (N16R8)
[env:esp32s3-n16r8]
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi
build_flags = -DBOARD_HAS_PSRAM

; ESP32-S3 with 4 MB flash
[env:esp32s3-4mb]
board_upload.flash_size = 4MB
board_build.partitions = default.csv
